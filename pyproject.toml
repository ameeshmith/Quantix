[project]
name = "quantix"
version = "0.1.0"
description = "Production-grade MCP server for analyzing SEC EDGAR filings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "mcp[cli]>=1.2.0,<2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rapidfuzz>=3.8.0",
]

[project.scripts]
quantix = "quantix.server:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]
